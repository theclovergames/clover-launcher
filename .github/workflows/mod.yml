# Construit le mod Clover (mod/) et publie le jar avec sa sha512 en artefact. Le dépôt de la
# publication sur le CDN et l'écriture de la sha512 dans manifest/<canal>.lock.json restent des
# gestes relus à la main (manifest.mjs pin).
name: Mod Clover

on:
  workflow_dispatch:
  push:
    paths: ["mod/**"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mod
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      # Toutes les versions de Minecraft, copiées dans src-tauri/client-mods/ (embarquées par le launcher).
      - run: ./gradlew launcherJars --no-daemon
      - name: Empreinte des jar
        run: |
          cd ../src-tauri/client-mods
          for jar in *.jar; do sha512sum "$jar" | tee "$jar.sha512"; done
      - uses: actions/upload-artifact@v5
        with:
          name: cloverclient
          path: src-tauri/client-mods/*
