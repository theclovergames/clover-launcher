pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        mavenCentral()
        gradlePluginPortal()
    }
}

rootProject.name = 'cloverclient'

// Un sous-projet par version de Minecraft visée : versions/<version>/gradle.properties.
file('versions').eachDir { dir ->
    include(":${dir.name}")
    project(":${dir.name}").projectDir = dir
}
